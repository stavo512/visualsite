<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- INTRO SCREEN -->
    <div id="intro-screen" class="screen active">
        <div id="hero">
            <h1 id="headline">
                <span class="block left">visuals</span>
                <span class="block middle">speak louder</span>
                <span class="block right">than words</span>
            </h1>
            <div class="hint">Press [E] to explore</div>
        </div>
    </div>

    <!-- VIDEO ARRANGEMENTS CONTAINER -->
    <div id="arrangements-container" class="screen">
        <div class="container">
            <!-- outside stuf wood-->
            <div class="arrangement" id="arrangement1">
                <img src="vids/stool.png" alt="Stool" 
                     style="position: absolute; top: 0; right: 0; width: auto; height: 100%;">
                <img src="vids/trevolte.png" alt="Trevolte" 
                     style="position: absolute; top: 0; left: 0; width: auto; height: 100%;">
                <video src="vids/survowlance promo (online-video-cutter.com).mp4" muted loop 
                       style="position: absolute; top: 0; left: 33.33%; width: 33.33%; height: 33.3%;"></video>
                <img src="vids/log.png" alt="Log" 
                     style="position: absolute; bottom: 0; left: 33.3%; width: 33.3%; height: 64%;">
            </div>

            <!-- greenha -->
            <div class="arrangement" id="arrangement2">
                <video src="vids/light.mp4" muted loop 
                       style="position: absolute; top: 0; left: 0; width: auto; height: 100%;"></video>
            </div>

            <!-- playground -->
            <div class="arrangement" id="arrangement7">
                <video src="vids/pg.mp4" muted loop 
                       style="position: absolute; top: 0; left: 0; width: auto; height: 100%;"></video>
            </div>

            <!-- horologes -->
            <div class="arrangement" id="arrangement4">
                <video src="vids/cloxwa.mp4" muted loop 
                       style="position: absolute; top: 0; left: 0; width: auto; height: 100%;"></video>
                <video src="vids/pos.mp4" muted loop 
                       style="position: absolute; bottom: 0px; right: 0px; width: auto; height: 100%;"></video>
            </div>

            <!-- transport -->
            <div class="arrangement" id="arrangement5">
                <video src="vids/exprelessgrai.mp4" muted loop 
                       style="position: absolute; top: 0; left: 0; width: auto; height: 115%;"></video>
                <video src="vids/ampel.mp4" muted loop 
                       style="position: absolute; bottom: 0; right: 0; width: auto; height: 100%;"></video>
            </div>

            <!-- fancyfancy -->
            <div class="arrangement" id="arrangement6">
                <video src="vids/srv.mp4" muted loop 
                       style="position: absolute; top: 0; left: 0; width: 59.5%; height: 62%;"></video>
                <img src="vids/ren 2.png" alt="Ren" 
                     style="position: absolute; bottom: 0; right: 0; width: auto; height: 100%;">
                <img src="vids/showcase.png" alt="Showcase" 
                     style="position: absolute; bottom: 0; left: 0; width: auto; height: 35.25%;">
            </div>

            <!-- lighting - interior -->
            <div class="arrangement" id="arrangement3">
                <img src="vids/lights.png" alt="Lights" 
                     style="position: absolute; top: 0; right: 0; width: auto; height: 100%;">
                <img src="vids/sofa.png" alt="Sofa" 
                     style="position: absolute; bottom: 0; left: 0; width: 33%; height: 34%;">
                <img src="vids/ref.png" alt="Ref" 
                     style="position: absolute; bottom: 0; right: 40.6%; width: 25%; height: 34%;">   
                <video src="vids/schrnkx.mp4" muted loop 
                       style="position: absolute; top: 0; left: 0; width: 59.4%; height: auto;"></video>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
